<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Style Advisor — StyleHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --primary:#6C3BFF;--accent:#C850C0;
      --grad:linear-gradient(135deg,#6C3BFF,#C850C0);
      --bg:#0a0a0b;--surface:rgba(255,255,255,0.05);
      --border:rgba(255,255,255,0.1);
      --text:#fff;--text2:rgba(255,255,255,0.7);--text3:rgba(255,255,255,0.4);
      --radius:16px;--font-head:'Outfit',sans-serif;--font-body:'Inter',sans-serif;
    }
    html,body{height:100%;font-family:var(--font-body);background:var(--bg);color:var(--text);}

    /* ── Background orbs ── */
    .bg-orb{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:0;}
    .bg-orb-1{width:500px;height:500px;background:radial-gradient(circle,rgba(108,59,255,0.2),transparent 70%);top:-150px;left:-150px;}
    .bg-orb-2{width:400px;height:400px;background:radial-gradient(circle,rgba(200,80,192,0.15),transparent 70%);bottom:-100px;right:-100px;}

    /* ── Header ── */
    .adv-header{
      position:sticky;top:0;z-index:100;
      display:flex;align-items:center;gap:14px;
      padding:14px 20px;
      background:rgba(10,10,11,0.85);
      backdrop-filter:blur(20px);
      border-bottom:1px solid var(--border);
    }
    .adv-back{
      display:flex;align-items:center;justify-content:center;
      width:38px;height:38px;border-radius:50%;
      background:var(--surface);border:1px solid var(--border);
      color:var(--text2);font-size:1.1rem;cursor:pointer;
      text-decoration:none;transition:background 0.2s;
    }
    .adv-back:hover{background:rgba(108,59,255,0.2);}
    .adv-logo{display:flex;align-items:center;gap:8px;}
    .adv-logo-icon{
      width:36px;height:36px;border-radius:10px;
      background:var(--grad);display:flex;align-items:center;justify-content:center;
      font-size:1.1rem;box-shadow:0 4px 14px rgba(108,59,255,0.4);
    }
    .adv-logo-text{font-family:var(--font-head);font-size:1.1rem;font-weight:800;}
    .adv-logo-text span{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .adv-status{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:0.75rem;color:var(--text3);}
    .adv-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;animation:pulse 2s infinite;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

    /* ── Chat area ── */
    .adv-body{
      position:relative;z-index:1;
      display:flex;flex-direction:column;
      height:calc(100vh - 67px);
    }
    .chat-messages{
      flex:1;overflow-y:auto;padding:20px 16px;
      display:flex;flex-direction:column;gap:16px;
      scrollbar-width:thin;scrollbar-color:rgba(108,59,255,0.3) transparent;
    }
    .chat-messages::-webkit-scrollbar{width:4px;}
    .chat-messages::-webkit-scrollbar-thumb{background:rgba(108,59,255,0.3);border-radius:2px;}

    /* ── Messages ── */
    .msg{display:flex;gap:10px;max-width:85%;animation:msgIn 0.3s cubic-bezier(0.34,1.56,0.64,1);}
    @keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .msg.user{align-self:flex-end;flex-direction:row-reverse;}
    .msg.bot{align-self:flex-start;}

    .msg-avatar{
      width:34px;height:34px;border-radius:50%;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;font-size:1rem;
    }
    .msg.bot .msg-avatar{background:var(--grad);box-shadow:0 4px 12px rgba(108,59,255,0.4);}
    .msg.user .msg-avatar{background:rgba(255,255,255,0.1);border:1px solid var(--border);}

    .msg-bubble{
      padding:12px 16px;border-radius:18px;
      font-size:0.88rem;line-height:1.6;
    }
    .msg.bot .msg-bubble{
      background:rgba(255,255,255,0.07);
      border:1px solid var(--border);
      border-bottom-left-radius:4px;
      color:var(--text);
    }
    .msg.user .msg-bubble{
      background:var(--grad);
      border-bottom-right-radius:4px;
      color:#fff;
    }
    .msg-time{font-size:0.65rem;color:var(--text3);margin-top:4px;text-align:right;}
    .msg.bot .msg-time{text-align:left;}

    /* ── Typing indicator ── */
    .typing{display:flex;gap:5px;padding:14px 16px;align-items:center;}
    .typing span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.4);animation:typingDot 1.2s infinite;}
    .typing span:nth-child(2){animation-delay:0.2s;}
    .typing span:nth-child(3){animation-delay:0.4s;}
    @keyframes typingDot{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

    /* ── Quick suggestions ── */
    .quick-chips{
      display:flex;flex-wrap:wrap;gap:8px;
      padding:0 16px 12px;
    }
    .quick-chip{
      padding:7px 14px;border-radius:999px;
      font-size:0.75rem;font-weight:600;font-family:var(--font-body);
      background:rgba(108,59,255,0.15);border:1px solid rgba(108,59,255,0.3);
      color:rgba(255,255,255,0.8);cursor:pointer;
      transition:background 0.2s,transform 0.2s;
    }
    .quick-chip:hover{background:rgba(108,59,255,0.35);transform:translateY(-1px);}

    /* ── Input bar ── */
    .chat-input-bar{
      padding:12px 16px;
      background:rgba(10,10,11,0.9);
      backdrop-filter:blur(20px);
      border-top:1px solid var(--border);
      display:flex;gap:10px;align-items:flex-end;
    }
    .chat-input{
      flex:1;background:rgba(255,255,255,0.07);
      border:1.5px solid var(--border);border-radius:14px;
      padding:12px 16px;font-size:0.9rem;font-family:var(--font-body);
      color:#fff;outline:none;resize:none;max-height:120px;min-height:46px;
      transition:border-color 0.2s;line-height:1.5;
    }
    .chat-input::placeholder{color:var(--text3);}
    .chat-input:focus{border-color:var(--primary);}
    .send-btn{
      width:46px;height:46px;border-radius:14px;flex-shrink:0;
      background:var(--grad);border:none;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 4px 14px rgba(108,59,255,0.4);
      transition:transform 0.2s,box-shadow 0.2s;
    }
    .send-btn:hover{transform:scale(1.08);box-shadow:0 6px 20px rgba(108,59,255,0.6);}
    .send-btn svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

    /* ── Image grid in messages ── */
    .msg-images{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
    .msg-images img{width:90px;height:120px;object-fit:cover;border-radius:10px;cursor:pointer;transition:transform 0.2s;}
    .msg-images img:hover{transform:scale(1.05);}

    /* ── Camera button ── */
    .camera-btn{
      width:46px;height:46px;border-radius:14px;flex-shrink:0;
      background:rgba(255,255,255,0.07);border:1.5px solid var(--border);
      cursor:pointer;display:flex;align-items:center;justify-content:center;
      transition:background 0.2s,border-color 0.2s;
    }
    .camera-btn:hover{background:rgba(108,59,255,0.2);border-color:var(--primary);}
    .camera-btn svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
    .img-preview-wrap{padding:8px 16px 0;display:none;}
    .img-preview-wrap.show{display:flex;gap:8px;flex-wrap:wrap;}
    .img-preview{position:relative;display:inline-block;}
    .img-preview img{width:80px;height:80px;object-fit:cover;border-radius:10px;border:2px solid var(--primary);}
    .img-preview-remove{position:absolute;top:-6px;right:-6px;width:20px;height:20px;background:#ef4444;border:none;border-radius:50%;color:#fff;font-size:.75rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
    .welcome-card{
      background:rgba(255,255,255,0.04);border:1px solid var(--border);
      border-radius:20px;padding:24px;margin:8px 0;text-align:center;
    }
    .welcome-card .wc-icon{font-size:2.5rem;margin-bottom:12px;}
    .welcome-card h2{font-family:var(--font-head);font-size:1.3rem;font-weight:800;margin-bottom:8px;}
    .welcome-card p{font-size:0.82rem;color:var(--text2);line-height:1.6;}
  </style>
</head>
<body>
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>

  <header class="adv-header">
    <a onclick="history.back()" class="adv-back" style="cursor:pointer">←</a>
    <div class="adv-logo">
      <div class="adv-logo-icon">✨</div>
      <div class="adv-logo-text">AI Style <span>Advisor</span></div>
    </div>
    <div class="adv-status">
      <div class="adv-dot"></div>
      Online
    </div>
  </header>

  <div class="adv-body">
    <div class="chat-messages" id="chat-messages">
      <div class="welcome-card">
        <div class="wc-icon">👗</div>
        <h2>Your Personal Style Advisor</h2>
        <p>Ask me anything about fashion — outfit ideas, color combinations, occasion dressing, trends, or what to wear. I'll give you honest, accurate advice.</p>
      </div>
    </div>

    <div class="quick-chips" id="quick-chips">
      <button class="quick-chip" onclick="sendQuick(this)">What should I wear to a wedding?</button>
      <button class="quick-chip" onclick="sendQuick(this)">Best colors for dark skin tone?</button>
      <button class="quick-chip" onclick="sendQuick(this)">How to dress for a job interview?</button>
      <button class="quick-chip" onclick="sendQuick(this)">What is quiet luxury style?</button>
      <button class="quick-chip" onclick="sendQuick(this)">How to style a saree?</button>
      <button class="quick-chip" onclick="sendQuick(this)">Best outfit for summer?</button>
    </div>

    <div class="chat-input-bar">
      <input type="file" id="img-upload" accept="image/*" multiple style="display:none"/>
      <button class="camera-btn" onclick="document.getElementById('img-upload').click()" title="Upload outfit photo">
        <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </button>
      <div style="flex:1;display:flex;flex-direction:column;gap:6px;">
        <div class="img-preview-wrap" id="img-preview-wrap"></div>
        <textarea class="chat-input" id="chat-input" placeholder="Ask about outfits, or upload a photo for styling advice..." rows="1"></textarea>
      </div>
      <button class="send-btn" onclick="sendMessage()" id="send-btn">
        <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>

  <script>
    const input = document.getElementById('chat-input');
    const messagesEl = document.getElementById('chat-messages');
    let uploadedImages = [];

    // Camera handler
    document.getElementById('cam-upload').addEventListener('change', function() {
      const files = Array.from(this.files).slice(0, 1);
      if (!files.length) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        if (uploadedImages.length < 2) {
          uploadedImages.push(e.target.result);
          const previewWrap = document.getElementById('img-preview-wrap');
          const preview = document.createElement('div');
          preview.className = 'img-preview';
          const idx = uploadedImages.length - 1;
          preview.innerHTML = '<img src="' + e.target.result + '" style="width:80px;height:80px;object-fit:cover;border-radius:10px;border:2px solid var(--primary);"/><button class="img-preview-remove" onclick="removeImage(' + idx + ')" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;background:#ef4444;border:none;border-radius:50%;color:#fff;font-size:.75rem;cursor:pointer;display:flex;align-items:center;justify-content:center;">x</button>';
          previewWrap.appendChild(preview);
          previewWrap.classList.add('show');
          input.placeholder = uploadedImages.length === 2 ? 'Compare 2 outfits - which is better?' : 'Add message or upload another photo (max 2)...';
        }
      };
      reader.readAsDataURL(files[0]);
    });

    // Image upload handler - max 2 images
    document.getElementById('img-upload').addEventListener('change', function() {
      const files = Array.from(this.files).slice(0, 2);
      if (!files.length) return;
      uploadedImages = [];
      const previewWrap = document.getElementById('img-preview-wrap');
      previewWrap.innerHTML = '';
      files.forEach((file, idx) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          uploadedImages.push(e.target.result);
          const preview = document.createElement('div');
          preview.className = 'img-preview';
          preview.innerHTML = '<img src="' + e.target.result + '" style="width:80px;height:80px;object-fit:cover;border-radius:10px;border:2px solid var(--primary);"/><button class="img-preview-remove" onclick="removeImage(' + idx + ')" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;background:#ef4444;border:none;border-radius:50%;color:#fff;font-size:.75rem;cursor:pointer;display:flex;align-items:center;justify-content:center;">x</button>';
          previewWrap.appendChild(preview);
          previewWrap.classList.add('show');
          input.placeholder = uploadedImages.length === 2 ? 'Compare 2 outfits - which is better?' : 'Add message or upload another photo (max 2)...';
        };
        reader.readAsDataURL(file);
      });
    });

    function removeImage(idx) {
      if (idx !== undefined) uploadedImages.splice(idx, 1);
      else uploadedImages = [];
      const previewWrap = document.getElementById('img-preview-wrap');
      if (!uploadedImages.length) {
        previewWrap.classList.remove('show');
        previewWrap.innerHTML = '';
        document.getElementById('img-upload').value = '';
        input.placeholder = 'Ask about outfits, or upload a photo for styling advice...';
      } else {
        previewWrap.innerHTML = '';
        uploadedImages.forEach((img, i) => {
          const preview = document.createElement('div');
          preview.className = 'img-preview';
          preview.innerHTML = '<img src="' + img + '" style="width:80px;height:80px;object-fit:cover;border-radius:10px;border:2px solid var(--primary);"/><button class="img-preview-remove" onclick="removeImage(' + i + ')" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;background:#ef4444;border:none;border-radius:50%;color:#fff;font-size:.75rem;cursor:pointer;display:flex;align-items:center;justify-content:center;">x</button>';
          previewWrap.appendChild(preview);
        });
      }
    }

    function analyzeOutfitImage(base64) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = 50; canvas.height = 50;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, 50, 50);
          const data = ctx.getImageData(0, 0, 50, 50).data;
          let r = 0, g = 0, b = 0, count = 0;
          for (let i = 0; i < data.length; i += 4) { r += data[i]; g += data[i+1]; b += data[i+2]; count++; }
          r = Math.round(r/count); g = Math.round(g/count); b = Math.round(b/count);
          const brightness = (r*299 + g*587 + b*114) / 1000;
          const isDark = brightness < 85;
          const isLight = brightness > 170;
          const isWarm = r > g && r > b;
          const isCool = b > r && b > g;
          resolve({ r, g, b, brightness, isDark, isLight, isWarm, isCool });
        };
        img.src = base64;
      });
    }

    function getOutfitAdvice(info, label) {
      const { isDark, isLight, isWarm, isCool, brightness } = info;
      let tone, advice, score;
      if (isDark && !isWarm && !isCool) { tone = 'Dark Neutral'; score = 88; advice = 'Very sophisticated and versatile. Works great for formal, office, and evening occasions. Add gold or silver accessories for contrast. Nude heels or white sneakers balance the look well.'; }
      else if (isLight && !isWarm && !isCool) { tone = 'Light Neutral'; score = 85; advice = 'Clean and fresh base. Extremely versatile - works for casual, office, and smart casual. Add a darker accessory (navy bag, brown belt) for depth. Almost any shoe color works.'; }
      else if (isWarm && brightness > 100) { tone = 'Warm & Bright'; score = 82; advice = 'Energetic and eye-catching! Warm tones like terracotta, mustard, and rust are very on-trend. Pair with gold jewelry and tan leather accessories. Nude or brown footwear completes the look.'; }
      else if (isWarm && brightness <= 100) { tone = 'Warm & Deep'; score = 86; advice = 'Rich and luxurious tones. Deep warm colors like burgundy and burnt orange are very elegant. Gold accessories and dark leather shoes elevate this further. Great for festive and evening occasions.'; }
      else if (isCool && brightness > 120) { tone = 'Cool & Light'; score = 84; advice = 'Fresh and modern palette. Cool blues, lavenders, and mints are very flattering. Silver accessories work best. White or grey shoes keep it cohesive. Great for casual and daytime occasions.'; }
      else if (isCool && brightness <= 120) { tone = 'Cool & Deep'; score = 87; advice = 'Bold and powerful cool tones. Deep blues, purples, and teals are very striking. Silver or white gold accessories complement perfectly. Black or white shoes work best.'; }
      else { tone = 'Mixed Tones'; score = 80; advice = 'Interesting color mix! Keep accessories neutral (white, black, or nude) to let the outfit breathe. Ensure the fit is tailored - that is the most important factor. Consider if the colors have a common undertone (all warm or all cool) for better harmony.'; }
      return { tone, advice, score };
    }

    function compareOutfits(info1, info2) {
      const a1 = getOutfitAdvice(info1, 'Outfit 1');
      const a2 = getOutfitAdvice(info2, 'Outfit 2');
      const winner = a1.score >= a2.score ? 1 : 2;
      const diff = Math.abs(a1.score - a2.score);
      let comparison = '';
      if (diff <= 3) comparison = 'Both outfits are very close in style score! It comes down to personal preference and occasion.';
      else comparison = 'Outfit ' + winner + ' scores higher overall.';

      return '👗 Outfit Comparison:\n\n' +
        '📸 Outfit 1 — ' + a1.tone + ' (Score: ' + a1.score + '/100)\n' + a1.advice + '\n\n' +
        '📸 Outfit 2 — ' + a2.tone + ' (Score: ' + a2.score + '/100)\n' + a2.advice + '\n\n' +
        '🏆 Verdict: ' + comparison + '\n\n' +
        '💡 Pro tip: The outfit that fits better and suits the occasion wins every time, regardless of color score.';
    }

    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    });
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    function sendQuick(btn) {
      input.value = btn.textContent;
      document.getElementById('quick-chips').style.display = 'none';
      sendMessage();
    }

    function sendMessage() {
      const text = input.value.trim();
      if (!text && !uploadedImages.length) return;

      if (uploadedImages.length > 0) {
        const now = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
        const imgDiv = document.createElement('div');
        imgDiv.className = 'msg user';
        const imgsHtml = uploadedImages.map(src => '<img src="' + src + '" style="width:120px;height:150px;object-fit:cover;border-radius:12px;display:inline-block;"/>').join('');
        imgDiv.innerHTML = '<div class="msg-avatar">&#128100;</div><div><div class="msg-bubble" style="padding:8px;">' + imgsHtml + (text ? '<div style="margin-top:8px;">' + text + '</div>' : '') + '</div><div class="msg-time">' + now + '</div></div>';
        messagesEl.appendChild(imgDiv);
        messagesEl.scrollTop = messagesEl.scrollHeight;

        const images = [...uploadedImages];
        input.value = '';
        input.style.height = 'auto';
        removeImage();
        showTyping();

        if (images.length === 2) {
          Promise.all([analyzeOutfitImage(images[0]), analyzeOutfitImage(images[1])]).then(([info1, info2]) => {
            removeTyping();
            appendMsg('bot', compareOutfits(info1, info2), 'outfit fashion', 'outfit fashion');
          });
        } else {
          analyzeOutfitImage(images[0]).then(info => {
            removeTyping();
            const a = getOutfitAdvice(info);
            appendMsg('bot', '📸 Outfit Analysis — ' + a.tone + ' (Score: ' + a.score + '/100)\n\n' + a.advice, 'outfit fashion', 'outfit fashion');
          });
        }
      } else {
        appendMsg('user', text);
        input.value = '';
        input.style.height = 'auto';
        showTyping();
        setTimeout(() => {
          removeTyping();
          const reply = getReply(text);
          appendMsg('bot', reply, text, reply);
        }, 900 + Math.random() * 600);
      }
    }

    function getReply(q) {
      const query = q.toLowerCase();
      if (query.includes('wedding')) {
        if (query.includes('guest')) return 'As a wedding guest, avoid white, ivory, or cream. Great choices: dusty rose, sage green, navy, burgundy, or gold. For Indian weddings, opt for lehengas, sarees, or sherwanis. For Western weddings, a midi dress or tailored suit works perfectly.';
        return 'For a wedding, choose elegant attire. Women: sarees, lehengas, anarkalis, or formal gowns. Men: sherwanis for Indian weddings, suits or tuxedos for Western. Avoid casual wear and jeans.';
      }
      if (query.includes('interview') || query.includes('job')) return 'For a job interview, dress one level above the dress code. Corporate roles: formal suit in navy, charcoal, or black. Creative roles: smart casual - tailored trousers and a neat shirt or blouse.';
      if (query.includes('dark skin') || query.includes('brown skin')) return 'For dark skin tones - Best colors: Emerald green, royal blue, deep purple, burgundy, terracotta, mustard, coral, fuchsia, cobalt, white and ivory.';
      if (query.includes('fair skin') || query.includes('light skin')) return 'For fair skin tones - Best colors: Navy, cobalt blue, forest green, burgundy, plum, coral, peach, blush pink, lavender, mint.';
      if (query.includes('quiet luxury') || query.includes('old money')) return 'Quiet Luxury is about understated elegance. Key pieces: cashmere sweaters, tailored trousers, crisp white shirts, loafers, minimal leather bags. Color palette: beige, camel, ivory, cream, navy, grey - no loud prints or logos.';
      if (query.includes('saree') || query.includes('sari')) return 'Saree styling tips - Draping: The Nivi drape is most common and flattering. Blouse: Well-fitted is key, deep back and off-shoulder styles are trending. Accessories: Keep jewelry minimal if the saree is heavy. Footwear: Block heels are comfortable for long events.';
      if (query.includes('summer')) return 'Best summer outfit ideas - Fabrics: Linen, cotton, chambray - breathable and sweat-resistant. Colors: White, sky blue, coral, mint, yellow, pastels. For women: Flowy midi dresses, linen co-ord sets. For men: Linen shirts, cotton polos, chino shorts.';
      if (query.includes('color') || query.includes('colour') || query.includes('combination')) return 'Top color combination rules - Complementary: Blue + Orange, Purple + Yellow - bold and high contrast. Analogous: Blue + Purple + Pink - harmonious. Rule of Three: Max 3 colors per outfit. One dominant (60%), one secondary (30%), one accent (10%).';
      if (query.includes('casual')) return 'Casual outfit formula - Top: Plain tee, oversized shirt, or casual blouse. Bottom: Well-fitted jeans, chinos, or casual trousers. Shoes: White sneakers, loafers, or clean casual shoes. Elevate it: Add a denim jacket, a minimal watch, or a crossbody bag.';
      if (query.includes('formal') || query.includes('office') || query.includes('work')) return 'Formal/office dressing guide - Men: Tailored suit (navy or charcoal), crisp white shirt, leather shoes. Women: Tailored blazer + trousers, pencil skirt + blouse, or a structured midi dress. Colors: Navy, charcoal, black, white, grey, burgundy.';
      if (query.includes('denim') || query.includes('jeans')) return 'Denim styling guide - Slim fit: versatile, works for casual and smart casual. Wide-leg: trendy, pair with fitted top. Straight leg: the most universally flattering. Dark wash: more formal. Light wash: casual, summer-friendly.';
      if (query.includes('trend') || query.includes('2025') || query.includes('2026')) return 'Top fashion trends (2025-2026): 1. Quiet Luxury - Understated, logo-free basics. 2. Dopamine Dressing - Bold, saturated colors. 3. Eco Chic - Sustainable fabrics, earthy tones. 4. Gorpcore - Outdoor utility meets street style. 5. Wide-leg everything.';
      if (query.includes('ethnic') || query.includes('kurta') || query.includes('lehenga') || query.includes('indian')) return 'Indian ethnic wear guide - Women: Saree, Lehenga, Anarkali, Kurta + palazzo. Men: Sherwani, Kurta + churidar, Nehru jacket. Festive colors: Red, gold, emerald, royal blue, maroon, mustard.';
      if (query.includes('shoe') || query.includes('footwear') || query.includes('sneaker') || query.includes('heel')) return 'Footwear guide - White sneakers: the most versatile shoe ever. Loafers: smart casual, great for office and casual. Block heels: comfortable and stylish for events. Ankle boots: elevate any casual outfit. Nude/beige shoes elongate legs and go with everything.';
      const defaults = [
        'For "' + q + '", the key principles are: 1) Fit over brand - always. 2) Build on neutrals, accent with color. 3) Dress for the occasion but make it yours.',
        'Fashion is about expressing yourself confidently. Start with fit - well-fitted clothes in any style look better than expensive ill-fitting ones. What occasion are you dressing for?',
        'Build a capsule wardrobe of neutral basics (white shirt, dark jeans, black trousers, navy blazer) and add personality through accessories. What occasion are you dressing for?'
      ];
      return defaults[Math.floor(Math.random() * defaults.length)];
    }

    const PEXELS_KEY = 'pnS5DxR64RndghHPKjMyUKmDitzQ25lTNfI13wORqV63rmV4F9s6ZZHy';

    async function fetchImages(query) {
      try {
        const res = await fetch('https://api.pexels.com/v1/search?query=' + encodeURIComponent(query) + '&per_page=3&orientation=portrait', {
          headers: { 'Authorization': PEXELS_KEY }
        });
        const data = await res.json();
        return (data.photos || []).map(p => p.src.medium);
      } catch { return []; }
    }

    function extractImageQuery(userText, aiReply) {
      const t = (userText + ' ' + (aiReply || '')).toLowerCase();
      if (t.includes('wedding')) {
        if (t.includes('sherwani') || t.includes('groom')) return 'indian groom sherwani wedding';
        if (t.includes('lehenga') || t.includes('bride')) return 'bridal lehenga indian wedding';
        if (t.includes('guest')) return 'wedding guest elegant dress';
        return 'indian wedding outfit';
      }
      if (t.includes('interview')) return 'professional job interview outfit suit';
      if (t.includes('office') || t.includes('formal')) return 'formal office outfit blazer';
      if (t.includes('saree') || t.includes('sari')) return 'silk saree draping elegant';
      if (t.includes('lehenga')) return 'lehenga choli festive fashion';
      if (t.includes('kurta')) return 'kurta ethnic wear fashion';
      if (t.includes('casual')) return 'casual street style outfit';
      if (t.includes('summer')) return 'summer linen cotton outfit';
      if (t.includes('denim') || t.includes('jeans')) return 'denim jeans street fashion';
      if (t.includes('sneaker')) return 'sneakers street fashion shoes';
      if (t.includes('heel')) return 'high heels elegant women shoes';
      if (t.includes('quiet luxury') || t.includes('old money')) return 'quiet luxury minimal fashion beige';
      if (t.includes('party')) return 'party night out fashion outfit';
      if (t.includes('ethnic') || t.includes('indian')) return 'indian ethnic festive fashion';
      const stopWords = ['what','should','i','wear','to','a','the','for','how','best','outfit','style','fashion'];
      const words = userText.toLowerCase().split(/\s+/).filter(w => w.length > 3 && !stopWords.includes(w));
      return (words.slice(0, 3).join(' ') || 'fashion outfit') + ' style';
    }

    async function appendMsg(role, text, userText, aiReply) {
      userText = userText || '';
      aiReply = aiReply || '';
      const now = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      let imagesHtml = '';
      if (role === 'bot' && userText) {
        const query = extractImageQuery(userText, aiReply);
        const imgs = await fetchImages(query);
        if (imgs.length) {
          imagesHtml = '<div class="msg-images">' + imgs.map(src => '<img src="' + src + '" alt="fashion" loading="lazy"/>').join('') + '</div>';
        }
      }
      div.innerHTML = '<div class="msg-avatar">' + (role === 'bot' ? '&#10024;' : '&#128100;') + '</div><div><div class="msg-bubble">' + text + imagesHtml + '</div><div class="msg-time">' + now + '</div></div>';
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'msg bot';
      div.id = 'typing-msg';
      div.innerHTML = '<div class="msg-avatar">&#10024;</div><div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function removeTyping() {
      const t = document.getElementById('typing-msg');
      if (t) t.remove();
    }

    window.addEventListener('load', () => {
      const user = JSON.parse(localStorage.getItem('sh_user') || 'null');
      const name = user ? user.name : 'there';
      setTimeout(() => {
        appendMsg('bot', 'Hi ' + name + '! I am your AI Style Advisor. Ask me anything about fashion - outfits, colors, occasions, trends, and more!');
      }, 400);
    });
</script>
